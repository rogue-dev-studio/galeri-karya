    body.rw-notice-lock { overflow: hidden; }

    }
    .rw-notice__panel h2 { font-size: 1.15rem; margin: 0 0 0.5rem; }
    .rw-notice__panel p { margin: 0 0 1rem; color: #333; }
    .rw-notice__actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .rw-notice__actions a,
    .rw-notice__actions button {
      display: inline-block;
      padding: 0.45rem 0.8rem;
      border: 1px solid #000;
      background: #000;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    .rw-notice__actions button {
      background: #fff;
      color: #000;
    }
  </style>
